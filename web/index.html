<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>溯源 — 本地设计文件反向检索</title>
<link rel="icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<h1 class="sr-only">溯源：把同事发来的图拖进来，找出它的源文件</h1>
<div id="app">
  <header id="top">
    <div class="brand">
      <img class="brand-mark" src="/static/icon.png" alt="">
      <span class="brand-name">溯源</span>
    </div>

    <!-- 搜索框：拖图入口嵌在框内右侧，不再单独占顶栏一格 -->
    <div class="searchbox" id="searchbox">
      <svg class="sb-icon" width="13" height="13" viewBox="0 0 14 14" fill="none">
        <circle cx="6" cy="6" r="4.2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M9.2 9.2L12 12" stroke="currentColor" stroke-width="1.3"
              stroke-linecap="round"/>
      </svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="搜文件名或路径，空格分隔多个词">
      <button class="sb-clear" id="q-clear" style="display:none">
        <svg width="9" height="9" viewBox="0 0 10 10">
          <path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>

      <div class="dz-chip" id="dz">
        <span class="dz-chip-idle" id="dz-empty">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
            <path d="M8 11V3m0 0L5 6m3-3l3 3" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2.5 10.5v2A1.5 1.5 0 004 14h8a1.5 1.5 0 001.5-1.5v-2"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span id="dz-text">拖图搜索</span>
        </span>
        <img class="dz-thumb" id="dz-thumb" alt="">
        <span class="dz-name" id="dz-name"></span>
        <span class="dz-state" id="dz-state"></span>
        <button class="dz-clear" id="dz-clear" aria-label="取消搜索">
          <svg width="9" height="9" viewBox="0 0 10 10">
            <path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="sb-panel" id="q-panel"></div>
    </div>

    <div class="seg sm" id="search-mode">
      <div class="seg-item on" data-sm="name">文件名</div>
      <div class="seg-item" data-sm="text">图中文</div>
      <div class="seg-item" data-sm="semantic">画面</div>
    </div>

    <div class="top-spacer"></div>

    <button class="btn sm ghost" id="btn-update">
      <svg width="11" height="11" viewBox="0 0 14 14" fill="none">
        <path d="M12 7a5 5 0 11-1.5-3.5M12 2v3.5H8.5" stroke="currentColor"
              stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="btn-update-text">更新索引</span>
    </button>

    <button class="btn sm ghost" id="btn-settings">
      <svg width="11" height="11" viewBox="0 0 14 14" fill="none">
        <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M7 1.5v1.6M7 10.9v1.6M1.5 7h1.6M10.9 7h1.6M3.1 3.1l1.1 1.1M9.8 9.8l1.1 1.1M3.1 10.9l1.1-1.1M9.8 4.2l1.1-1.1"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="status" id="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">就绪</span>
    </div>
  </header>

  <div id="idxbar"><div class="idxbar-fill" id="idxbar-fill"></div></div>

  <aside id="side">
    <div class="side-scroll scroll" id="side-scroll"></div>
  </aside>

  <main id="main">
    <div class="main-head">
      <span class="main-title" id="main-title">全部文件</span>
      <span class="main-count" id="main-count"></span>
      <div class="main-tools">
        <!-- 文字索引入口。原在顶栏，那里已经有 9 个元素、1440 才勉强放下。
             它本质是「图中文」模式的附属功能，移到主区标题栏更贴切。 -->
        <button class="btn sm ghost ocr-entry" id="btn-ocr" style="display:none">
          <svg width="11" height="11" viewBox="0 0 14 14" fill="none">
            <rect x="2" y="2" width="10" height="10" rx="1.5"
                  stroke="currentColor" stroke-width="1.3"/>
            <path d="M4.5 6h2M4.5 8.5h5" stroke="currentColor"
                  stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span id="btn-ocr-text">文字索引</span>
          <span class="ocr-entry-dot" id="btn-ocr-dot" style="display:none"></span>
        </button>
        <div class="seg" id="view-seg">
          <div class="seg-item on" data-view="grid">网格</div>
          <div class="seg-item" data-view="list">列表</div>
        </div>
        <div class="select" id="sort-select"></div>
      </div>
    </div>
    <div class="query-hint" id="query-hint" style="display:none"></div>
    <div class="grid-wrap scroll" id="grid-wrap">
      <div class="grid" id="grid"></div>
    </div>
    <div class="empty" id="empty" style="display:none"></div>
  </main>

  <aside id="detail">
    <div class="detail-scroll scroll" id="detail-scroll"></div>
  </aside>
</div>

<div id="dropmask"><div class="dropmask-inner">松开以搜索这张图</div></div>
<div id="tip"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script src="/static/app.js"></script>
<script src="/static/semantic.js"></script>
</body>
</html>
